# -- Blowfish Theme Configuration --

colorScheme = "ocean"
defaultAppearance = "light"
autoSwitchAppearance = true
keywords = ["blog", "developer", "ai", "tech"]

[author]
  name = "sesame"
  headline = "Software Engineer / Developer"
  bio = "Software Engineer exploring AI, Container Architecture & Modern Web."
  links = [
    { github = "https://github.com/sesame" }
  ]

enableSearch = true
enableCodeCopy = true
enableA11y = false
enableStructuredBreadcrumbs = true

smartTOC = true
smartTOCHideUnfocusedChildren = false

[header]
  layout = "fixed-gradient"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "profile"
  showRecent = true
  showRecentItems = 10
  showMoreLink = true
  showMoreLinkDest = "/posts/"
  cardView = true

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = true
  showHero = false
  showBreadcrumbs = true
  showDraftLabel = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  showCategories = true
  showTags = true
  showWordCount = true
  showZenMode = false

[list]
  showHero = false
  showBreadcrumbs = true
  showSummary = true
  showTableOfContents = false
  groupByYear = false
  cardView = true

[taxonomy]
  showTermCount = true
  showTableOfContents = false

[term]
  showHero = false
  showBreadcrumbs = true
