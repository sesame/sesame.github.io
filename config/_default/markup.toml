# -- Markup Configuration --

[highlight]
  codeFences = true
  guessSyntax = true
  lineNos = true
  lineNumbersInTable = true
  noClasses = false

[goldmark]
  [goldmark.renderer]
    unsafe = true
  [goldmark.parser.attribute]
    block = true
    title = true
  [goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true
    [goldmark.extensions.passthrough]
      enable = true
      [goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

[tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false
